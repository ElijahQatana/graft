name: Release

# Runs when a bare version tag such as 0.1.0 is pushed (no "v" prefix).
# A tag with a suffix, such as 1.0.0-rc.1, is published as a pre-release.
# Pushing the tag is a manual decision; see CONTRIBUTING.md.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Check tag against manifest.json and versions.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const manifest = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(require("fs").readFileSync("versions.json", "utf8"));
            if (manifest.version !== tag) {
              console.error(`Tag ${tag} does not match manifest.json version ${manifest.version}.`);
              process.exit(1);
            }
            if (!(tag in versions)) {
              console.error(`versions.json has no entry for ${tag}.`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes $flags
